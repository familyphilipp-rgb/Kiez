<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kiez – keine Verbindung</title>
  <style>
    @font-face { font-family: 'Space Grotesk'; src: url('fonts/SpaceGrotesk.woff2') format('woff2'); font-weight: 300 700; }
    :root { --bg: #F7F9FB; --fg: #272C35; --muted: #555E6E; --red: #CD1818; }
    @media (prefers-color-scheme: dark) { :root { --bg: #14171F; --fg: #E8ECF1; --muted: #AEB7C4; --red: #E04545; } }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: 'Space Grotesk', system-ui, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
    svg { color: var(--red); margin-bottom: 18px; }
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--red); }
    h1 { margin: 6px 0 10px; font-size: 24px; }
    p { margin: 0 0 22px; color: var(--muted); line-height: 1.5; max-width: 320px; }
    button { border: 0; background: var(--red); color: #fff; font: inherit; font-weight: 700; border-radius: 999px; padding: 12px 26px; min-height: 48px; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22V8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/><circle cx="12" cy="5" r="3"/></svg>
    <span class="eyebrow">Keine Verbindung</span>
    <h1>Kiez ist gerade nicht erreichbar</h1>
    <p>Prüf deine Internetverbindung. Wenn die passt, ist der Kiez-Server gerade nicht erreichbar. Versuch es gleich noch einmal.</p>
    <button id="retry">Erneut versuchen</button>
  </main>
  <script>
    // Wird beim APK-Build durch scripts/set-server-url.js auf die echte Adresse gesetzt
    const SERVER_URL = 'https://kiez.ideenwerft-friedenau.de';
    document.getElementById('retry').onclick = () => { location.href = SERVER_URL; };
    window.addEventListener('online', () => { location.href = SERVER_URL; });
  </script>
</body>
</html>
