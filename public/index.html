<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FF9908">
  <title>Kiez – was passiert um dich herum</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Kiez</div>
    <div class="place" id="place">Standort wird gesucht…</div>
    <button class="karma" id="karma" title="Dein Karma">0</button>
  </header>

  <nav class="tabs" id="tabs">
    <button data-sort="new" class="active">Neueste</button>
    <button data-sort="popular">Beliebt</button>
    <button data-sort="loud">Am lautesten</button>
  </nav>

  <main id="view"></main>

  <button class="fab" id="fab" aria-label="Neuer Post">+</button>

  <dialog id="composer">
    <form method="dialog" id="composeForm">
      <div class="compose-card" id="composeCard">
        <textarea id="composeText" maxlength="250" placeholder="Was ist los in deiner Gegend?" required></textarea>
        <div class="counter"><span id="count">0</span>/250</div>
      </div>
      <div class="compose-actions">
        <button type="button" class="ghost" id="cancelCompose">Abbrechen</button>
        <button type="submit" class="primary" id="sendCompose">Senden</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
