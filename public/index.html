<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#F7F9FB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11141B" media="(prefers-color-scheme: dark)">
  <meta name="view-transition" content="same-origin">
  <title>Kiez – was passiert um dich herum</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="preload" href="/fonts/SpaceGrotesk.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/Syne.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Kiez – Startseite">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22V8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/><circle cx="12" cy="5" r="3"/></svg>
      <span>KIEZ</span>
    </a>
    <button class="place" id="place" aria-label="Standort ändern">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      <span id="placeLabel">Standort…</span>
    </button>
    <button class="karma" id="karma" aria-label="Dein Karma"><span class="star">★</span><span id="karmaValue">0</span></button>
  </header>

  <div class="ptr" id="ptr" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></div>

  <main id="view" tabindex="-1"></main>

  <nav class="bottomnav" id="bottomnav" aria-label="Hauptnavigation">
    <button data-nav="feed" class="active">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg>
      <span>Kiez</span>
    </button>
    <button data-nav="mine">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>Meine</span>
    </button>
    <button class="fab" id="fab" aria-label="Neuer Post">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button data-nav="channels">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/></svg>
      <span>Kanäle</span>
    </button>
    <button data-nav="profile">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      <span>Profil</span>
    </button>
  </nav>

  <dialog class="sheet composer" id="composer" aria-label="Neuer Post">
    <form id="composeForm">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="composer-head">
        <button type="button" class="ghost" id="cancelCompose">Abbrechen</button>
        <span class="eyebrow">Neuer Post</span>
        <button type="submit" class="primary small" id="sendCompose">Posten</button>
      </div>
      <textarea id="composeText" maxlength="250" placeholder="Was ist los in deiner Gegend?" rows="4"></textarea>
      <div id="composeTags" class="tag-suggest"></div>
      <div id="composeMedia" class="compose-media"></div>
      <div class="composer-foot">
        <div id="composeButtons"></div>
        <svg class="ring" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15"/><circle id="ringFill" cx="18" cy="18" r="15"/></svg>
        <span class="counter" id="count">250</span>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
